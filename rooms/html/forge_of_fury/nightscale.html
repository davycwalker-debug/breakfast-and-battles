<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/breakfast-and-battles/favicon.ico">
    <title>Area 52: Nightscale</title>
</head>
<body>
    <div class="container">
        <div id="encounter-output"></div>
    </div>
    <script type="module">
        import { renderRoomTemplate } from '../../js/renderer.js';
        import '../../js/interactions.js';
        
        const roomData = {
          // ==================================================================
          // CORE HEADER INFO
          // ==================================================================
          
          /* [Strict String] The main header text of the encounter area (e.g., Room Name).
             CRITICAL: This string acts as the exact unique primary key identifier used by 
             the JavaScript engine to match and pull monster data from CSV database files. */
          "title": `Area 52: Nightscale`,

          // ==================================================================
          // NARRATIVE & INITIAL ABILITY CHECKS
          // ==================================================================
          
          /* [Markdown/HTML String] Descriptive narrative flavor text meant to be read aloud by the DM.
             UI PRESENTATION: Renders inside a stylized boxed callout block with a green accent border.
             FORMATTING: Fully supports HTML inline text tags like <strong>, <em>, or links. */
          "readAloud": `The dilapidated bridge leads to another ledge that winds southeast alongside a very large lake, 
          the source of the underground river. The cavern is quite large; the lake's far shore is lost in shadow, 
          and the echoes of water seem to indicate a very sizable cave.`,
          
          /* [Array of Objects] (Optional) Instant skill checks or saving throws required 
             immediately upon entering the area or interacting with the initial description.
             UI PRESENTATION: Generates independent challenge cards containing clean success/failure branches. */
          "initialReadAloudChecks": [
            {
              "type": `Spot Check`,
              "dc": `18`,
              /* Contextual prompt omitted intentionally here to show layout adaptability. 
                 If left blank or omitted, the UI card cleanly collapses around the success/failure branches. */
              "success": `You catch a glimpse of a serpentine form moving in the darkness.`,
              "failure": `You don't notice anything.`
            },
            {
              "type": `Listen Check`,
              "dc": `Nightscale's Move Silently Check +4`,
              /* Contextual prompt omitted intentionally here to show layout adaptability. 
                 If left blank or omitted, the UI card cleanly collapses around the success/failure branches. */
              "success": `You hear a small splash, drawing your attention to the lake.`,
              "failure": `You don't notice anything.`
            }
          ],

          // ==================================================================
          // ENVIRONMENT & ARCHITECTURE
          // ==================================================================
          
          /* [Object] Spatial parameters, illumination rules, and structural exits defining the physical layout. */
          "environment": {
            "dimensions": `80 ft x 85 ft room, 100 ft ceiling`, // [String] Total physical layout metrics (e.g., "40 ft. x 40 ft. room, 15 ft. ceiling")
            "illumination": `Darkness`, // [String] Light state rules (e.g., "Darkness", "Bright light from wall torches")
            
            /* [Array of Objects] Points of interest, distinct architectural details, hazards, or furnishings.
               UI PRESENTATION: Formatted into a structured, clean-scannable bulleted layout. */
            "features": [
              {
                "name": `Lake`, // [String] The title of the feature or object (e.g., "Altar", "Rubbish Pile")
                "desc": `A massive, deep lake.`  // [Markdown String] Detailed description, physical attributes, or interaction limits
              }
            ],
            
            /* [Array of Objects] Portals, doorways, secret paths, or passages leading out of this environment. */
            "doors": [
              {
                "location": `West Passage`, // [String] Cardinal direction or spatial point (e.g., "North Door", "Secret Floor Trapdoor")
                "desc": `Leads to <a href="https://davycwalker-debug.github.io/breakfast-and-battles/rooms/html/forge_of_fury/dwarf_bridges.html">Area 51 (Dwarf Bridges)</a>.`      // [Markdown String] Structural materials, locking mechanisms, lockpick/strength DCs, or destination
              },
              {
                "location": `East Island`, // [String] Cardinal direction or spatial point (e.g., "North Door", "Secret Floor Trapdoor")
                "desc": `This island is <a href="https://davycwalker-debug.github.io/breakfast-and-battles/rooms/html/forge_of_fury/nightscales_hoard.html">Area 53 (Nightscale's Hoard)</a>`      // [Markdown String] Structural materials, locking mechanisms, lockpick/strength DCs, or destination
              },
              {
                "location": `East Passage`, // [String] Cardinal direction or spatial point (e.g., "North Door", "Secret Floor Trapdoor")
                "desc": `This underwater passage, roughly 700 feet long and all submerged, connects the Black Lake to the Dark Mere on the east side of the Stone Tooth.`      // [Markdown String] Structural materials, locking mechanisms, lockpick/strength DCs, or destination
              }
            ]
          },

          // ==================================================================
          // COMBATANTS & COMBAT ENGINE DATA
          // ==================================================================
          
          /* [Markdown String] (Optional) Setup rules, positioning guidelines, or map square assignments for creatures.
             UI PRESENTATION: Appears directly beneath the interactive initiative tracker layout. */
          "setupPositions": `Nightscale begins combat submerged in the water.`,

          // ==================================================================
          // STRATEGY & BEHAVIOR
          // ==================================================================
          
          /* [Object] (Optional) Automated decision loops, tactical priorities, and movement mechanics for combatants. */
          "tactics": {
            "initialRound": `Nightscale sticks her head out, breathes acid, then moves away.`, // [Markdown String] Opening round priority, ambush triggers, or global battle field alterations.
            
            /* [Array of Objects] Specialized behavioral matrices mapped to specific creature types in the roster. */
            "individual": [
              {
                "name": `Nightscale`,     // [String] Matches the exact creature type identifier name.
                "strategy": `If the party can't fight her in the water, she will stay there breathing acid when her breath recharges. 
                If they can, she will climb up behind them on the ledge, attmepting to melee anyone who looks weak. 
                She is not afraid to run away underwater if needed to reposition.`  // [Markdown String] Custom targeting logic, priority spells, spell lists, or flight thresholds.
              }
            ]
          },
          // ==================================================================
          // SPECIAL DYNAMIC TRIGGER CARDS
          // ==================================================================
          
          /* [Array of Objects] (Optional) Dynamic mid-encounter events or secondary room phases.
             UI PRESENTATION: Renders standalone alert card banners styled via severity strings.
             SEVERITY VARIATIONS: Accepts 'danger' (red theme), 'warning' (orange theme), or 'info' (purple theme). */
          "specialEvents": [
            {
              "severity": `danger`, 
              "title": `Nightscale Attacks!`,     // [String] Headline title of the changing event or mechanical notification.
              "trigger": `Players travel along the shore.`,   // [String] The criteria or round number that fires this card (e.g., "When reduced to 50% HP").
              "readAloud": `As you pick your way along the lakeshore, you hear a small splash and catch a glimpse of a small green light moving in the darkness. 
              Then the water erupts in spray as a black dragon the size of a small horse bursts out of the water!`, // [Markdown String] Instant narrative block text for the DM to read as the room state changes.
            }
          ]
        };

        renderRoomTemplate('encounter-output', roomData);
    </script>
</body>
</html>
