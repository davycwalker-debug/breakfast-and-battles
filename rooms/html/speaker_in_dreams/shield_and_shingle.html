<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/breakfast-and-battles/favicon.ico">
    <title>Brindindord Tavern: Shield and Shingle</title>
</head>
<body>
    <div class="container">
        <div id="encounter-output"></div>
    </div>
    <script type="module">
        import { renderRoomTemplate } from '../../js/renderer.js';
        import '../../js/interactions.js';
        
        const roomData = {
          "title": `Brindindord Tavern: Shield and Shingle`,
          
          "readAloud": `The Shield and Shingle hums with the low, warm chatter of off-duty guards, traveling merchants, and weary adventurers. 
          Strong scents of roasted meat, stale ale, and hearth-smoke fill the main hall. Tucked into a quiet corner booth, away from the hearth's glow, 
          sits a halfling woman staring intently into an untouched tankard. Her eyes are red-rimmed, nervously scanning every new face that walks through the tavern doors.`,
          
          "initialReadAloudChecks": [
            {
              "type": `Sense Motive Check`,
              "dc": `20`,
              "success": `The woman is clearly not here to drink or socialize. Her posture is tense, 
              and she is desperately waiting for someone who looks capable of handling a dangerous task.`,
              "failure": `The tavern seems like a standard, bustling drinking hole. The woman in the corner looks tired and visibly distressed.`
            }
          ],

          "environment": {
            "dimensions": `60 ft. x 50 ft. room, 10 ft. ceiling.`,
            "illumination": `Brightly lit in the central hearth and bar area by crackling fireplaces and wall-mounted oil lanterns; 
            dim light in the hallway and private guest quarters.`,
            
            "features": [
              {
                "name": `Main Dining Hall & Hearth`,
                "desc": `Occupies the center of the tavern. Features multiple round eating tables, a large stone fireplace to the north with a prominent animal hide rug, 
                and a long dining table for larger groups in the northeast nook.`
              },
              {
                "name": `Bar Counter & Kitchen`,
                "desc": `Located in the southeast wing. A sturdy wooden L-shaped bar is lined with stools, behind which lies the food preparation counter, 
                hearth stoves, and storage barrels for ale and spirits.`
              },
              {
                "name": `Guest Rooms & Hallway`,
                "desc": `Along the western wall lies a private hallway leading to three modest guest bedrooms furnished with twin beds, 
                small nightstands, and storage trunks for rent.`
              }
            ],
            
            "doors": [
              {
                "location": `South Main Entrance`,
                "desc": `Double wooden doors leading out to the main thoroughfare of 
                <a href=https://davycwalker-debug.github.io/breakfast-and-battles/maps/html/brindinford.html>Brindinford</a>. Unlocked.`
              },
              {
                "location": `North Exit / Cellar Access`,
                "desc": `A single heavy oak door at the end of the north hallway leading to a small rear alleyway.`
              },
              {
                "location": `Guest Room Doors`,
                "desc": `Simple wooden doors along the western corridor. Outfitted with good locks (DC 30 Open Lock Check).`
              }
            ]
          },

          "dialogueTree": [
            {
              "prompt": `Approach Mela`,
              "speaker": `Mela`,
              "response": `She perks up instantly, her face lighting up with tearful hope. 
              'Please, are you available for hire? My husband, Amnic, has been missing for days! 
              He runs The Reality Wrinkle, a bookstore in the merchant district. 
              He went to work his morning shift and simply vanished into thin air. 
              I'm offering everything I have left as a bounty for his safe return.'`
            },
            {
              "prompt": `Ask about her investigation.`,
              "speaker": `Mela`,
              "response": `'Well, I spoke with Jellik, Amnic's apprentice. He was as baffled as I was. 
              He arrived for his evening shift only to find the front door unlocked and the shop completely empty. 
              He hasn't seen him since either. We looked around the store, but nothing seemed disturbed.'`
            },
            {
              "prompt": `Ask where to begin.`,
              "speaker": `Mela`,
              "response": `'The Reality Wrinkle is the last place anyone saw him. Jellik is taking over the shop operations full-time now, 
              but he'll surely let you inspect the storefront if you tell him I sent you.'`
            },
            {
              "prompt": `Ask about the Reality Wrinkle.`,
              "speaker": `Mela`,
              "response": `'It's a bookstore in the merchant district. 
              Amnic converted his old wizard tower into living space and opened the shop on the ground floor to give us a proper income when we got married. 
              He's been spending less time there to be with our family the last few years, but it was always a peaceful place. 
              It's where he was last seen before he vanished.'`
            },
            {
              "prompt": `Ask about Jellik.`,
              "speaker": `Mela`,
              "response": `'Jellik is Amnic's apprentice and shopkeeper for the evening shifts. Amnic hired him a while back so he could spend more time with our children. 
              He's about Amnic's age and always seemed like a sweet, hardworking man who just wanted to learn about magic. He was heartbroken when Amnic disappeared, 
              but he paid me a lump sum to take over the running of the shop so I could put out the bounty for Amnic's return.'`
            }
          ],
        };

        renderRoomTemplate('encounter-output', roomData);
    </script>
</body>
</html>
