        import '../../js/interactions.js';
        
        const roomData = {
          "title": `Area 15a: Storefront`,

          "readAloud": `Tall wooden bookshelves line the walls of this cozy shop, packed with treatises on arcana, history, and religious dogma.

          A small table stands in one corner with two chairs pulled up to it. A counter juts from the opposite wall. 
          Behind the counter, a brocaded curtain hangs in a doorway, its design depicting an alien landscape filled with tentacled creatures of unimaginable monstrosity.`,
          
          "initialReadAloudChecks": [
            {
              "type": `Knowledge (the planes) Check`,
              "dc": `20`,
              "success": `You recognize the bizarre entities depicted on the books and curtain as manifestations associated with alienism—a dangerous philosophy devoted to the Far Realm, a void of madness inhabited by aberrations like wystes and gibbering mouthers.`,
              "failure": `The illustrations and titles are strange, unsettling, and abstract, but you cannot identify a specific realm or school of magic.`
            },
            {
              "type": `Sense Motive Check`,
              "dc": `20`,
              "success": `Jellik is hiding something regarding his study group and private quarters, but his distress over Amnic's disappearance is entirely genuine—he is not lying about being ignorant of Amnic's fate.`,
              "failure": `Jellik seems somewhat nervous and defensive about his private space, but otherwise appears to be a mild-mannered shopkeeper.`
            }
          ],

          "environment": {
            "dimensions": `30 ft. x 40 ft. room, 10 ft. ceiling`,

            "features": [
              {
                "name": `Bookstacks & Display Counters`,
                "desc": `Numerous tall and short bookcases filled with arcane, historical, and planar research materials. 
                Jellik is currently restocking several sections with alien or esoteric literature.`
              },
              {
                "name": `Service Desk`,
                "desc": `A wooden counter near the center divider where transactions occur. Contains standard ledgers, ink, and parchment.`
              },
              {
                "name": `Table`,
                "desc": `A study for customers to read and study at sits across from the counter.`
              }
            ],
            
            "doors": [
              {
                "location": `South Entrance Steps`,
                "desc": `Double doors leading out to the merchant district street of <a href=https://davycwalker-debug.github.io/breakfast-and-battles/maps/html/brindinford.html>Brindinford</a>. Unlocked during shop hours.`
              },
              {
                "location": `North Curtain`,
                "desc": `Protected by an alarm spell set by Jellik via scroll. Crossing into <a href="https://davycwalker-debug.github.io/breakfast-and-battles/rooms/html/speaker_in_dreams/back_room.html">Area 15b (Back Room)</a> without Jellik's permission triggers an alert.`
              }
            ]
          },

          "dialogueTree": [
            {
              "prompt": `Ask Jellik about Amnic's disappearance.`,
              "speaker": `Jellik`,
              "response": `'I wish I knew what happened to him. I came out from my room in the back for my evening shift like any other day, 
              but the front door was unlocked and Amnic was gone. I truly hope he turns up safe.'`

            {
              "prompt": `Ask to search his private quarters upstairs or in the back.`,
              "speaker": `Jellik`,
              "response": `'Absolutely not. My living quarters are private, and Amnic had no business back there anyway. 
              You're free to look around the storefront all you like—I want answers too—but if you try breaking into my personal space, I'll call the watch.'`

            {
              "prompt": `Confront Jellik about signs of a struggle (DC 14 Search success).`,
              "speaker": `Jellik`,
              "response": `Jellik looks genuinely startled, stepping out from behind the counter to look at the scuffs. 
              'A struggle? Here? I... I thought he had just walked out early. Could someone have taken him?'`

            {
              "prompt": `Show Jellik the temple of Mystra pamphlet (DC 18 Search success).`,
              "speaker": `Jellik`,
              "response": `'Oh, that! A former study partner of mine named Kevrin recently left our group to join the new temple of Mystra in town.

              Amnic did start spending a lot more time here researching afterwards, though I never asked him the details.'`
            },
            {
              "prompt": `Ask about "Those Who Hear" or his study group (Return Visit).`,
              "speaker": `Jellik`,
              "response": `Jellik's genial expression hardens immediately, his posture going stiff. 
              'Where did you hear that name? We are simply seekers of hidden truths, minding our own studies. What happens behind those curtains is no concern of yours.'`
            },
            {
              "prompt": `Confront Jellik about the dead man with strange bite marks found in the shop (Return Visit).`,
              "speaker": `Jellik`,

              Nothing more! I told the witnesses and the watch everything they needed to know.'`
            },
            {
              "prompt": `Ask about Alein or the attack at the Shrine of Helm (Return Visit).`,
              "speaker": `Jellik`,

              'I don't know anyone by that name, nor do I keep track of troubles at local shrines. I run a bookstore, nothing more.

            {
              "prompt": `Inform Jellik of Amnic's fate in the Temple of Mystra (Return Visit).`,
              "speaker": `Jellik`,
              "response": `Jellik pales visibly, stumbling back half a step. 
              'Dead? Tortured on a rack by a cult of Shar...? Gods... I only wanted him to retire and focus on his family. 
              If I knew introducing him to Kevrin... I never—we never wanted him harmed!'`
            }
          ],

          "setupPositions": `Jellik stands near the bookshelves or counter. He avoids combat if possible and will call the town watch or retreat upstairs to his cult allies if threatened with violence.`,

          "treasure": {
            "containers": [
              {
                "name": `Till`,
                "contents": `12 gp`
              }
            ]
          },

          "specialEvents": [
            {
              "severity": `info`, 
              "title": `Party Searches the Storefront`,
              "mechanics": [
                {
                  "type": `Search Check`,
                  "dc": `14`,
                  "success": `You notice subtle scuff marks and a disturbed rug near the counter, indicating a sudden, brief struggle took place here.`,
                  "failure": `The floor appears clean, though the reorganization of the bookshelves seems somewhat hurried.`
                },
                {
                  "type": `Search Check`,
                  "dc": `18`,
                  "success": `Fallen deep into a crack between the floorboards, you discover a dropped pamphlet advertising Brindinford's new temple of Mystra. 
                  Written on the back in different handwriting is: "Do they really hold Mystra's Sacred Trust?"`,
                  "failure": `You find nothing beyond stray bits of parchment and dust wedged beneath the furniture.`
                }
              ]
            },
            {
              "severity": `info`, 
              "title": `Second Time Around`,
              "readAloud": `Something is not right in this place. The angles formed by walls, bookshelves, floors, and ceilings seem wrong, 
              as if space itself were warped here. Scrolls and tomes, some bound in materials you do not recognize, fill shelves that line every wall. 
              A small table stands in one corner with two chairs pulled up to it. A counter juts from the opposite wall. Behind the counter, 
              a brocaded curtain hangs in a doorway, its design depicting an alien landscape filled with tentacled creatures of unimaginable monstrosity.`,
            }
          ],
        };

        renderRoomTemplate('encounter-output', roomData);
