<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/breakfast-and-battles/favicon.ico">
    <title>Temple of Mystra</title>
    <style>
        /* Reset and layout basics */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; /* Dark theme makes images pop */
            color: #ffffff;
            overflow: hidden; /* Prevents awkward scrollbars on desktop */
        }

        /* Container that holds both image sections */
        .showcase-container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }

        /* Container to hold and center the stack */
        .music-container {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            
            display: flex;
            flex-direction: column; /* Stack children vertically */
            align-items: center;    /* Center them horizontally */
            gap: 12px;              /* Spacing between each stacked section */
        }

        /* Individual Floating Song/Music Section */
        .music-section {
            position: relative; /* Changed from absolute to relative */
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            
            /* Optional: ensures they don't stretch to full width awkwardly */
            width: max-content; 
        }

        .music-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d8b4fe; /* Subtle Mystra/Arcane violet tint */
        }

        .music-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .music-link:hover {
            color: #d8b4fe;
            text-decoration: underline;
        }

        .music-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Individual clickable card wrapper */
        .image-card {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes title to the bottom */
            align-items: center;
            text-decoration: none; /* Removes underline from links */
            color: inherit;
            overflow: hidden;
            border: 2px solid #121212; /* Clean separation line */
            transition: flex 0.4s ease; /* Smooth hover expand effect */
        }

        /* High-performance background image sizing */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
            z-index: 1;
        }

        /* Dark overlay to ensure titles are readable over bright images */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0) 100%);
            z-index: 2;
            transition: background 0.3s ease;
        }

        /* Text Title styles */
        .image-title {
            position: relative;
            z-index: 3;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5vh; /* Responsive spacing from bottom */
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        /* Desktop Hover Effects */
        @media (hover: hover) {
            .image-card:hover {
                flex: 1.15; /* Slightly expands the hovered section */
            }
            .image-card:hover .bg-image {
                transform: scale(1.05); /* Soft zoom into the image */
            }
            .image-card:hover .overlay {
                background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.1) 100%);
            }
            .image-card:hover .image-title {
                transform: translateY(-5px);
            }
        }

        /* Mobile responsiveness - stack them vertically */
        @media (max-width: 768px) {
            body, html {
                overflow: auto; /* Allows scrolling on small screens */
            }
            .showcase-container {
                flex-direction: column;
                height: 100vh; /* Keeps total height to one viewport on load */
            }
            .music-container {
                top: 16px;
                width: 90%;
                max-width: 340px;
                display: flex;
                flex-direction: column;
                align-items: center; 
                gap: 8px; 
            }
            .music-section {
                width: 100%;
                box-sizing: border-box;
                padding: 8px 14px;
            }
            .image-card {
                flex: 1;
                min-height: 50vh; 
            }
            .image-title {
                font-size: 1.8rem;
                margin-bottom: 3vh;
            }
        }
    </style>
</head>
<body>

    <main class="showcase-container">
        <div class="music-container">
        </div>
        
        <a href="https://davycwalker-debug.github.io/breakfast-and-battles/maps/html/dungeons/mystra_temple.html" class="image-card" target="_self" rel="noopener">
            <div class="bg-image" style="background-image: url('https://github.com/davycwalker-debug/breakfast-and-battles/blob/main/maps/images/mystra_temple.jpg?raw=true');"></div>
            <div class="overlay"></div>
            <h2 class="image-title">Temple Level</h2>
        </a>

        <a href="https://davycwalker-debug.github.io/breakfast-and-battles/maps/html/dungeons/mystra_dungeon.html" class="image-card" target="_self" rel="noopener">
            <div class="bg-image" style="background-image: url('https://github.com/davycwalker-debug/breakfast-and-battles/blob/main/maps/images/mystra_dungeon.jpg?raw=true');"></div>
            <div class="overlay"></div>
            <h2 class="image-title">Dungeon Level</h2>
        </a>

    </main>

</body>
</html>

<script>
    function addMusicSection(name, path, port = '4533') {
        const container = document.querySelector('.music-container');
        if (!container) return;

        // Define your base URLs here once
        const liveUrl = `http://albanywc.duckdns.org:${port}/share/${path}#/`;
        const localUrl = `http://localhost:${port}/share/${path}#/`;

        // Create the HTML structure safely
        const html = `
            <div class="music-section">
                <span class="music-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </span>
                <div class="music-content">
                    <span class="music-link">${name}: </span>
                    <a href="${liveUrl}" target="_blank" rel="noopener" class="music-link">DNS</a>
                    <span class="music-link"> | </span>
                    <a href="${localUrl}" target="_blank" rel="noopener" class="music-link">Local</a>
                </div>
            </div>
        `;

        // Append it to the container
        container.insertAdjacentHTML('beforeend', html);
    }
    addMusicSection('Nightsong', 'rgin3xMNLD');
    addMusicSection('Sixteen Strikes', 'l6T40FZRS7');
</script>
