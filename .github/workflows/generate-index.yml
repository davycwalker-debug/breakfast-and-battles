name: Generate Monster Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'monsters/html/*.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Index via Python
        run: |
          python3 -c "
          import os, glob, re, html

          folder = 'monsters/html'
          files = sorted([f for f in os.listdir(folder) if f.endswith('.html') and f != 'index.html'])
          
          links = []
          for filename in files:
              filepath = os.path.join(folder, filename)
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                      match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                      title = match.group(1).strip() if match else filename
                      # Sanitize title for HTML rendering
                      title = html.escape(html.unescape(title))
              except Exception:
                  title = filename
              
              links.append(f'    <li><a href=\"{filename}\">{title}</a></li>')

          index_html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <title>Monsters Directory</title>
              <style>
                  body {{ font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }}
                  h1 {{ border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }}
                  ul {{ list-style-type: none; padding: 0; }}
                  li {{ margin: 0.5rem 0; background: #f3f4f6; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #e5e7eb; }}
                  a {{ font-weight: bold; color: #2563eb; text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
              </style>
          </head>
          <body>
              <h1>Monsters Directory</h1>
              <ul>
          ''' + '\n'.join(links) + '''
              </ul>
          </body>
          </html>'''

          with open(os.path.join(folder, 'index.html'), 'w', encoding='utf-8') as f:
              f.write(index_html)
          "

      - name: Commit and Push Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add monsters/html/index.html
          git commit -m "Auto-update monster index.html" || exit 0
          git push