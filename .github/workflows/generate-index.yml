name: Generate Monster Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'monsters/html/*.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Index via Python
        run: |
          python3 -c "
          import os, glob, re, html

          folder = 'monsters/html'
          files = sorted([f for f in os.listdir(folder) if f.endswith('.html') and f != 'index.html'])
          
          links = []
          for filename in files:
              filepath = os.path.join(folder, filename)
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                      match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                      title = match.group(1).strip() if match else filename
                      # Sanitize title for HTML rendering
                      title = html.escape(html.unescape(title))
              except Exception:
                  title = filename
              
              links.append(f'        <li><a href=\"{filename}\">{title}</a></li>')

          index_html = f'''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>Monsters Directory</title>
              <style>
                  /* Flat White Site Background Environment & Centering */
                  html, body {{
                      background-color: #ffffff !important;
                      color: #000000 !important;
                      font-family: \"Verdana\", Arial, sans-serif;
                      margin: 0;
                      padding: 20px; 
                      display: flex;
                      justify-content: center;
                      flex-direction: column;
                      align-items: center;
                  }}

                  /* Base Document Wrapper Container */
                  .srd-container {{
                      max-width: 700px;
                      width: 100%;
                      background-color: #ffffff;
                      box-sizing: border-box;
                  }}

                  /* Section Header Rule */
                  .srd-header {{
                      border-bottom: 4px solid #8b2323;
                      padding-bottom: 5px;
                      margin-bottom: 15px;
                  }}

                  /* Spaced-out Title Header */
                  .srd-title {{
                      font-size: clamp(15pt, 4.5vw, 22pt); 
                      font-weight: bold;
                      color: #000000;
                      letter-spacing: 0.22em;
                      line-height: 1.4;
                      display: inline-block;
                      text-transform: uppercase;
                  }}

                  /* Search Input Field */
                  .srd-search-box {{
                      width: 100%;
                      box-sizing: border-box;
                      padding: 8px 12px;
                      font-family: \"Verdana\", Arial, sans-serif;
                      font-size: 9.5pt;
                      border: 2px solid #8b2323;
                      border-radius: 4px;
                      margin-bottom: 15px;
                      outline: none;
                  }}

                  .srd-search-box:focus {{
                      border-color: rgb(87, 158, 182);
                      box-shadow: 0 0 4px rgba(87, 158, 182, 0.5);
                  }}

                  /* Link List Formatting */
                  .srd-index-list {{
                      list-style-type: square;
                      padding-left: 20px;
                      margin: 0;
                      font-size: 9.5pt;
                      line-height: 1.8;
                  }}

                  .srd-index-list li {{
                      margin-bottom: 4px;
                  }}

                  /* Standard SRD Link Styling */
                  .srd-container a:link, 
                  .srd-container a:visited {{ 
                      text-decoration: none; 
                      color: rgb(87, 158, 182); 
                      font-weight: bold;
                  }}
                  .srd-container a:hover {{ 
                      text-decoration: underline; 
                  }}

                  /* Footer */
                  .srd-container p {{
                      font-size: 7.5pt !important;
                      line-height: 1.4 !important;
                      color: #666666 !important;
                      margin-top: 25px !important;
                      padding-top: 10px !important;
                      border-top: 1px dashed #cbd4c5 !important;
                  }}
              </style>
          </head>
          <body>
              <div class=\"srd-container\">
                  <div class=\"srd-header\">
                      <span class=\"srd-title\">Monsters Directory</span>
                  </div>

                  <input type=\"text\" id=\"monsterSearch\" class=\"srd-search-box\" onkeyup=\"filterMonsters()\" placeholder=\"Search monsters...\">

                  <ul id=\"monsterList\" class=\"srd-index-list\">
          ''' + '\n'.join(links) + '''
                  </ul>
                  <p>Auto-generated index of available SRD monster entries.</p>
              </div>

              <script>
                  function filterMonsters() {{
                      const input = document.getElementById('monsterSearch');
                      const filter = input.value.toLowerCase();
                      const ul = document.getElementById('monsterList');
                      const li = ul.getElementsByTagName('li');

                      for (let i = 0; i < li.length; i++) {{
                          const a = li[i].getElementsByTagName('a')[0];
                          const txtValue = a.textContent || a.innerText;
                          if (txtValue.toLowerCase().indexOf(filter) > -1) {{
                              li[i].style.display = '';
                          }} else {{
                              li[i].style.display = 'none';
                          }}
                      }}
                  }}
              </script>
          </body>
          </html>'''

          with open(os.path.join(folder, 'index.html'), 'w', encoding='utf-8') as f:
              f.write(index_html)
          "

      - name: Commit and Push Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add monsters/html/index.html
          git commit -m "Auto-update monster index.html with live search" || exit 0
          git push